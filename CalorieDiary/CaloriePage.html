<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Calorie Diary</title>

    <link rel="stylesheet" href="../style.css">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caesar+Dressing&family=Noto+Sans+Old+Hungarian&display=swap" rel="stylesheet">

    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <main>
        <h1 class="TopTitle">Welcome to Calorie Diary</h1>  
        <a href="../index.html">index</a>

        <div class="container">
            <header>
                <div class="date-picker-group">
                    <label for="diary-date">Date:</label>
                    <input type="date" id="diary-date">
                </div>
                <div class="json-controls">
                    <button class="btn-secondary" id="btn-export">Export JSON</button>
                    <button class="btn-secondary" id="btn-import">Import JSON</button>
                    <button class="btn-drive" id="btn-drive">Link Drive</button>
                    <input type="file" id="file-input" accept=".json" style="display: none;">
                </div>
            </header>
            <form class="add-form" id="food-form">
                <input type="text" id="food-name" placeholder="Food Name" required>
                <input type="text" id="food-desc" placeholder="Description (optional)">
                <input type="number" id="food-cals" placeholder="Calories" min="0" required>
                <button type="submit" class="btn-primary">Add Item</button>
            </form>

            <table>
                <thread>
                    <tr>
                        <th>Food</th>
                        <th>Description</th>
                        <th class="col-cal">Calories</th>
                        <th class="col-action"></th>
                    </tr>
                </thread>
                <tbody id="diary-body">
                    <!-- Dynamic rows inserted here -->
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="2">Total Calories</td>
                        <td class="col-cal" id="total-calories">0</td>
                        <td></td>
                    </tr>
                </tfoot>
            </table>
        </div>
        <div id="sync-status" class="sync-status">
            <div class="spinner"></div>
            <span id="sync-text">Syncing Drive...</span>
        </div>
    </main>
    <script src="CalorieScript.js"></script>
  </body>
